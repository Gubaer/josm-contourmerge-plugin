plugins {
    id 'groovy'
    id 'java'
}

group 'org.openstreetmap.josm'

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.apache.groovy', name: 'groovy', version: project.property('groovy_version')
    implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-yaml', version: project.property('jackson_version')
    implementation group: 'com.squareup.okhttp3', name: 'okhttp', version: project.property('okhttp3_version')
    implementation gradleApi()
}
