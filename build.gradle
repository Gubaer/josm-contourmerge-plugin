import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.time.ZonedDateTime
import java.time.format.DateTimeFormatter
import org.openstreetmap.josm.plugins.contourmerge.build.Releases
import org.openstreetmap.josm.plugins.contourmerge.release.CreateGithubReleaseTask
import org.openstreetmap.josm.plugins.contourmerge.release.PublishToGithubReleaseTask

plugins {
    id 'java'
    id 'groovy'
}

repositories {
    mavenCentral()
}

configurations {
    packIntoJar
}

def releases = Releases.fromFile(file("releases.yml"))
version = releases.currentPluginLabel

base {
    archivesName = "contourmerge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"
    packIntoJar "org.apache.commons:commons-lang3:${commons_lang3_version}"

    implementation "javax.validation:validation-api:2.0.1.Final"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${jupiter_version}"
    testImplementation "org.apache.groovy:groovy-all:${groovy_version}"
    testImplementation "org.apache.groovy:groovy-test:${groovy_version}"
    testImplementation "org.hamcrest:hamcrest-library:${hamcrest_version}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jupiter_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly files("software/josm/josm-latest.jar")
    testImplementation files("software/josm/josm-latest.jar")
    testImplementation files("software/josm/josm-unittest.jar")
}

tasks.register("downloadJosmJar") {
    def josmJar = file("software/josm/josm-latest.jar")
    def josmUnittestJar = file("software/josm/josm-unittest.jar")
    outputs.file(josmJar)
    outputs.file(josmUnittestJar)
    doLast {
        josmJar.parentFile.mkdirs()
        new URL("https://josm.openstreetmap.de/josm-latest.jar").withInputStream { is ->
            Files.copy(is, josmJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
        new URL("https://josm.openstreetmap.de/download/josm-unittest.jar").withInputStream { is ->
            Files.copy(is, josmUnittestJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

compileJava.dependsOn("downloadJosmJar")
compileTestJava.dependsOn("downloadJosmJar")
compileTestGroovy.dependsOn("downloadJosmJar")

tasks.named('jar') {
    archiveVersion = ""
    configurations.packIntoJar.each { dep ->
        from(zipTree(dep)) {
            eachFile { fcd ->
                if (fcd.path.startsWith("META-INF/LICENSE") || fcd.path.startsWith("META-INF/NOTICE")) {
                    def jarBaseName = dep.name.replaceAll(/\.jar$/, "")
                    fcd.path = fcd.path.replaceFirst("META-INF/", "META-INF/${jarBaseName}-")
                }
            }
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes("Plugin-Class": project.property("plugin.class"))
        attributes("Plugin-Link": project.property("plugin.link"))
        attributes("Plugin-Canloadatruntime": project.property("plugin.canloadatruntime"))
        attributes("Plugin-Date": ZonedDateTime.now().format(DateTimeFormatter.ISO_OFFSET_DATE_TIME))
        attributes("Plugin-Description": project.property("plugin.description"))
        attributes("Plugin-Icon": project.property("plugin.icon"))
        attributes("Plugin-Minium-Java-Version": "17")
        attributes("Plugin-Mainversion": releases.highestJosmVersion)
        attributes("Plugin-Version": releases.currentPluginLabel)

        releases.josmVersions.each { josmVersion ->
            final label = releases.highestPluginLabelForJosmVersion(josmVersion)
            final key = "${josmVersion}_Plugin-Url".toString()
            if (label.isNumber()) {
                final downloadUrl = new URL("https://raw.github.com/${project.property('github.user')}/josm-contourmerge-plugin/for-josm-${josmVersion}/dist/contourmerge.jar")
                attributes((key): "${label};${downloadUrl}")
            } else {
                final downloadUrl = new URL("https://github.com/${project.property('github.user')}/josm-contourmerge-plugin/releases/download/${label}/contourmerge.jar")
                attributes((key): "${label};${downloadUrl}")
            }
        }
    }
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" << "-Werror"
}

final JVM_ARGS = [
    '--add-opens', 'java.prefs/java.util.prefs=ALL-UNNAMED',
    '--add-exports', 'java.base/sun.security.action=ALL-UNNAMED',
    '--add-exports', 'java.desktop/com.sun.imageio.plugins.jpeg=ALL-UNNAMED',
    '--add-exports', 'java.desktop/com.sun.imageio.spi=ALL-UNNAMED'
]

test {
    useJUnitPlatform()
    jvmArgs JVM_ARGS
    scanForTestClasses = false
    systemProperty "josm.home", file("src/test/resources/josm.home").absolutePath
    testLogging {
        events "passed", "failed"
    }
}

sourceSets {
    main.resources {
        exclude "images/**/*.svg"
    }
}

processResources {
    from("$projectDir/README.md")
    from("$projectDir/LICENSE")
}

tasks.register("createGithubRelease", CreateGithubReleaseTask) {
    releaseTag = releases.currentPluginLabel
    releaseDescription = releases.currentReleaseDescription ?: ""
}

tasks.register("publishToGithubRelease", PublishToGithubReleaseTask) {
    localJarName = "contourmerge.jar"
    remoteJarName = "contourmerge.jar"
}
