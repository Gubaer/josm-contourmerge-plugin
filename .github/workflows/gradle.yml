name: Josm Contourmerge Plugin

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # build once every day
    - cron:  '0 1 * * *'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        jdk:
          - 17
          - 21
        platform:
          - ubuntu-latest
          - windows-latest

    name: Build plugin on ${{ matrix.platform }} - JDK ${{ matrix.jdk }}
    runs-on: ${{ matrix.platform }}

    env:
      JAVA_OPTS: "-Xmx6G"

    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '${{ matrix.jdk }}'
          distribution: 'microsoft'
      # headless X11 setup according to
      # https://stackoverflow.com/questions/68292797/running-java-gui-tests-on-github-using-xvfb
      - name: Set up virtual X11
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: sudo apt-get -y install xvfb
      - name: Start virtual frame buffer
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: Xvfb :19 -screen 0 1024x768x16 &
      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        env:
          DISPLAY: ":19"
        with:
          arguments: build
          
